name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx --yes firebase-tools@15.28.1 emulators:exec --project demo-pathways --only auth,firestore 'GOOGLE_CLOUD_PROJECT=demo-pathways npm run test:integration'
